<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравляю с 30-летием!</title>
    <!-- Подключаем библиотеку конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Чтобы сертификат не прокручивал страницу */
            font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a; /* Цвет фона */
        }

        /* Основной контейнер с фото друга */
        .gift-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('background.png'); /* <--- ВАШЕ СОХРАНЕННОЕ ФОТО */
            background-repeat: no-repeat;
            background-position: center center;
            /* ИСПРАВЛЕНО: 'contain' гарантирует, что фото будет видно целиком */
            background-size: contain;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Интерактивная зона поверх конверта на фото */
        .interactive-envelope {
            position: absolute;
            /* Настроено под новое отображение картинки */
            top: 60%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; /* Размер зоны конверта */
            height: 150px;
            cursor: pointer;
            z-index: 10;
        }

        /* Пульсирующая кнопка "Нажми сюда" */
        .click-hint {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ffd700, #ffae00);
            color: #222;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            animation: pulse 1.5s infinite;
            white-space: nowrap;
            display: block; /* Сначала показываем */
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5); }
            50% { transform: translateX(-50%) scale(1.05); box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5); }
        }

        /* Контейнер сертификата */
        .certificate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85); /* Затемнение */
            backdrop-filter: blur(10px); /* Размытие фона */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 100;
        }

        /* Показываем сертификат */
        .certificate-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Сам сертификат (выезжает снизу) */
        .certificate {
            background: #fff;
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 20px;
            border: 10px solid #ffd700; /* Золотая рамка */
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            transform: translateY(100vh) scale(0.8);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #333;
        }

        .certificate-overlay.active .certificate {
            transform: translateY(0) scale(1);
        }

        /* Текст сертификата */
        .certificate h1 {
            font-size: 32px;
            margin-bottom: 5px;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .certificate .age-badge {
            display: inline-block;
            background-color: #ffd700;
            color: #222;
            font-size: 48px;
            font-weight: 900;
            padding: 10px 20px;
            border-radius: 50%;
            margin-bottom: 20px;
            line-height: 1;
        }

        .certificate p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #555;
        }

        .certificate .present-type {
            font-size: 24px;
            font-weight: 700;
            color: #c0392b;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* Кнопка закрытия */
        .close-btn {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .close-btn:hover {
            background-color: #2c3e50;
        }

    </style>
</head>
<body>

    <div class="gift-container">
        <!-- Интерактивная зона поверх конверта -->
        <div class="interactive-envelope" id="envelopeZone">
            <div class="click-hint" id="clickHint">НАЖМИ СЮДА</div>
        </div>
    </div>

    <!-- Модальное окно с выезжающим сертификатом -->
    <div class="certificate-overlay" id="certOverlay">
        <div class="certificate">
            <div class="age-badge">30</div>
            <h1>С ЮБИЛЕЕМ!</h1>
            <p>Дорогой друг!<br><br>
               Пусть этот возраст станет началом<br>
               твоих самых больших побед!<br>
               А чтобы восстановить силы после корта,<br>
               прими этот скромный подарок:<br>
               <span class="present-type">СЕРТИФИКАТ НА МАССАЖ</span>
            </p>
            <button class="close-btn" id="closeBtn">Спасибо!</button>
        </div>
    </div>

    <script>
        const envelopeZone = document.getElementById('envelopeZone');
        const certOverlay = document.getElementById('certOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const clickHint = document.getElementById('clickHint');

        // Логика клика
        envelopeZone.addEventListener('click', () => {
            // 1. Убираем подсказку
            clickHint.style.display = 'none';

            // 2. Запускаем конфетти
            launchMainConfetti();

            // 3. Пауза перед выездом сертификата
            setTimeout(() => {
                certOverlay.classList.add('active');
            }, 600);
        });

        // Кнопка закрытия
        closeBtn.addEventListener('click', () => {
            certOverlay.classList.remove('active');
            // Показываем подсказку снова через время
            setTimeout(() => {
                clickHint.style.display = 'block';
            }, 1000);
        });

        // Настройки конфетти
        function launchMainConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 } });
            }, 250);
            setTimeout(() => {
                confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 } });
            }, 400);
        }
    </script>
</body>
</html>
